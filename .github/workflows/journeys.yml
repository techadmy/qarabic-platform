name: QA journeys

# Whole business scenarios across roles on the real stack (docs/standards/testing.md «Journeys»):
# the built API + PostgreSQL 17 + the production web build, no mocks, QA personas only. Runs on
# every PR, nightly and by hand. Not a required check (protect-main) until the owner says so.
on:
  pull_request:
  # Nightly, far from local midnight (classes are «today»). GitHub delays scheduled runs under load
  # and sometimes drops them (2026-11-18: no run at all; CodeQL's weekly one came 8 h late), so a
  # backup slot follows; the `gate` job skips a slot when a run on main already finished that night.
  schedule:
    - cron: '30 0 * * *' # 02:30 Cairo
    - cron: '45 3 * * *' # 05:45 Cairo, backup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # A scheduled slot runs only if no run on main finished (passed or failed) in the last 18 hours:
    # one nightly result whichever slot GitHub fires first. PRs and manual runs always go ahead.
    name: Nightly gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since="$(date -u -d '-18 hours' +%Y-%m-%dT%H:%M:%SZ)"
          done="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/journeys.yml/runs" \
            -f branch=main -f status=completed -f "created=>=$since" -f per_page=50 \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)
              | select(.event == \"schedule\" or .event == \"workflow_dispatch\")
              | select(.conclusion == \"success\" or .conclusion == \"failure\")] | length")"
          if [ "$done" -gt 0 ]; then
            echo "::notice::A journeys run on main already finished in the last 18 h: this slot is skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  journeys:
    name: QA journeys (real stack)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qarabic
          POSTGRES_PASSWORD: qarabic
          POSTGRES_DB: qarabic_journeys_test
          TZ: Africa/Cairo
          PGTZ: Africa/Cairo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qarabic" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The journeys' own database (qa:seed refuses anything not named *_test and empties it).
      JOURNEYS_DATABASE_URL: postgresql://qarabic:qarabic@localhost:5432/qarabic_journeys_test
      DATABASE_URL: postgresql://qarabic:qarabic@localhost:5432/qarabic_journeys_test
      # The commit the report names: the PR's head, not GitHub's merge commit.
      JOURNEYS_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Throwaway secrets for this run
        run: |
          for name in QA_PASSWORD QA_ZOOM_WEBHOOK_SECRET JOURNEYS_SESSION_SECRET; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "JOURNEYS_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qarabic/shared build
      - run: pnpm --filter @qarabic/api exec prisma migrate deploy
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @qarabic/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter @qarabic/web exec playwright install chromium
      - run: pnpm --filter @qarabic/web test:journeys
      # The step table on the run page, from journeys-summary.json (also uploaded below).
      - name: Journey summary
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: node e2e-journeys/step-summary.mjs journeys-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: qa-journeys-${{ github.run_id }}
          path: |
            apps/web/journeys-summary.json
            apps/web/journeys-results/
            apps/web/journeys-report/
          if-no-files-found: ignore
          retention-days: 30

  publish:
    # The public QA feed: after a nightly or manual run on main (never a PR), the run's summary,
    # the history and the dashboard's datasets are committed to the `qa-reports` branch, read by
    # the «Qarabic QA» dashboard and the Control Center (raw.githubusercontent.com/<repo>/qa-reports/
    # latest.json). QA personas only, no secrets. Only this job may write, and only that branch.
    name: Publish the QA feed
    needs: journeys
    if: ${{ !cancelled() && needs.journeys.result != 'skipped' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: qa-reports-feed
      cancel-in-progress: false
    steps:
      # A full checkout: a sparse one would also hide the feed's `shots/` folder from git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The run's summary
        id: summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh run download "$GITHUB_RUN_ID" -n "qa-journeys-$GITHUB_RUN_ID" -D artifact \
            && [ -f artifact/journeys-summary.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No journeys summary in this run (the journeys stopped before running): nothing published."
          fi
      - name: Update the qa-reports branch
        if: steps.summary.outputs.found == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch --depth 1 origin qa-reports; then
            git worktree add feed FETCH_HEAD
          else
            git worktree add --detach feed
            git -C feed checkout --orphan qa-reports
            git -C feed rm -rq --cached . && git -C feed clean -fdxq
          fi
          node apps/web/e2e-journeys/report-feed.mjs feed artifact/journeys-summary.json
          cat > feed/README.md <<'MD'
          # QA feed (generated)

          Written by the «QA journeys» workflow after each nightly or manual run on `main`. Do not edit.
          `latest.json` (last run, journeys-summary schema 1), `history.json` (last 60 journey runs),
          `runs.json` / `steps.json` (the «Qarabic QA» dashboard's datasets) and `shots/` (the latest
          failing step's screenshot). QA personas only; how journeys work: docs/standards/testing.md.
          MD
          git -C feed add -A
          git -C feed commit -qm "qa: ${GITHUB_EVENT_NAME} run ${GITHUB_RUN_ID}" || exit 0
          git -C feed push origin HEAD:refs/heads/qa-reports
