name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1' # weekly, for new queries on unchanged code

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    # Static analysis of the TypeScript/JavaScript (API, web, packages): open redirects, injection,
    # unsafe HTML, prototype pollution… Findings land in the Security tab and on the PR.
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - '**/generated/**'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/*.e2e-spec.ts'
              - 'apps/web/e2e/**'
              - 'apps/web/public/mockServiceWorker.js'
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:javascript-typescript'
