name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1' # weekly, for new queries on unchanged code

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    # Static analysis of the TypeScript/JavaScript (API, web, packages): open redirects, injection,
    # unsafe HTML, prototype pollution… Findings land in the Security tab and on the PR.
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - '**/generated/**'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/*.e2e-spec.ts'
              - 'apps/web/e2e/**'
              - 'apps/web/public/mockServiceWorker.js'
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: '/language:javascript-typescript'
