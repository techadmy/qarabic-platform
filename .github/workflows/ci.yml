name: CI

on:
  pull_request:
  push:
    branches: [main]

# The token only reads the repository (CodeQL has its own workflow with security-events: write).
permissions:
  contents: read

# A newer push cancels an older run on a PR branch; on main every merged commit is tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Format · lint · typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  api-e2e:
    name: API e2e (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qarabic
          POSTGRES_PASSWORD: qarabic
          POSTGRES_DB: qarabic_test
          # Not UTC on purpose: the API must store instants correctly whatever the server zone is
          # (test/db-timezone.e2e-spec.ts).
          TZ: Africa/Cairo
          PGTZ: Africa/Cairo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qarabic" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qarabic:qarabic@localhost:5432/qarabic_test
      TEST_DATABASE_URL: postgresql://qarabic:qarabic@localhost:5432/qarabic_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qarabic/shared build
      # Schema drift, before the tests (a red e2e must not hide it): the committed migrations,
      # applied to the empty database, must produce exactly prisma/schema.prisma. A model change
      # without its migration fails here (`--exit-code`: 0 = same, 2 = differences, 1 = error).
      - name: Apply the migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
      - name: Migrations match the Prisma schema
        working-directory: apps/api
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm --filter @qarabic/api test:e2e

  web-e2e-real:
    # The web app against the real API and a freshly seeded database (fake demo data only), so the
    # mock-only web e2e cannot hide contract drift between the screens and the API.
    name: Web e2e on the real API (Playwright + PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qarabic
          POSTGRES_PASSWORD: qarabic
          POSTGRES_DB: qarabic_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qarabic" --health-interval 5s --health-timeout 5s --health-retries 10
    # No NODE_ENV here: `next build` needs its own (production); the API and the seed default to
    # development.
    env:
      DATABASE_URL: postgresql://qarabic:qarabic@localhost:5432/qarabic_dev
      WEB_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:3000
      LOG_LEVEL: warn
      SEED_ADMIN_EMAIL: admin@example.test
      E2E_ADMIN_EMAIL: admin@example.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Throwaway secrets for this run
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          demo="$(openssl rand -hex 16)"
          echo "::add-mask::$demo"
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "SEED_ADMIN_PASSWORD=$password"
            echo "E2E_ADMIN_PASSWORD=$password"
            # The made-up demo logins (parents, teachers) for the portal specs.
            echo "SEED_DEMO_PASSWORD=$demo"
            echo "E2E_DEMO_PASSWORD=$demo"
          } >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qarabic/shared build
      - run: pnpm --filter @qarabic/api exec prisma migrate deploy
      - run: pnpm --filter @qarabic/api db:seed
      - run: pnpm --filter @qarabic/web exec playwright install chromium
      - run: pnpm --filter @qarabic/web test:e2e:real
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: node e2e/report-flaky.mjs e2e-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-real-api
          path: apps/web/playwright-report

  web-e2e:
    # Two shards (each builds the app, then runs half the specs): the full sweep of every screen at
    # three widths in two languages made one job the slowest by far.
    name: Web e2e (Playwright ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qarabic/shared build
      - run: pnpm --filter @qarabic/web exec playwright install chromium
      - run: pnpm --filter @qarabic/web test:e2e --shard=${{ matrix.shard }}/2
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: node e2e/report-flaky.mjs e2e-results.json
      # N8: the app is served at api.qarabic.com/app/ — build under /app and check links and assets
      # (once: on the first shard).
      - run: pnpm --filter @qarabic/web test:e2e
        if: matrix.shard == 1
        env:
          E2E_BASE_PATH: /app
          E2E_PORT: '3250'
      - name: Report flaky tests (/app run)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: apps/web
        run: node e2e/report-flaky.mjs e2e-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report

  deploy-scripts:
    name: Deploy scripts (shellcheck + harness + nginx -t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update -q && sudo apt-get install -y -q nginx-core shellcheck
      - run: shellcheck -x -P SCRIPTDIR *.sh tests/*.sh anonymise/*.sh
        working-directory: deploy
      - run: bash deploy/tests/deploy.test.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high
