name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format · lint · typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  api-e2e:
    name: API e2e (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qarabic
          POSTGRES_PASSWORD: qarabic
          POSTGRES_DB: qarabic_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qarabic" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qarabic:qarabic@localhost:5432/qarabic_test
      TEST_DATABASE_URL: postgresql://qarabic:qarabic@localhost:5432/qarabic_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qarabic/shared build
      - run: pnpm --filter @qarabic/api test:e2e

  web-e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qarabic/shared build
      - run: pnpm --filter @qarabic/web exec playwright install chromium
      - run: pnpm --filter @qarabic/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  web-e2e-real:
    # The web app against the real API and a freshly seeded database (fake demo data only), so the
    # mock-only web e2e cannot hide contract drift between the screens and the API.
    name: Web e2e on the real API (Playwright + PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qarabic
          POSTGRES_PASSWORD: qarabic
          POSTGRES_DB: qarabic_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qarabic" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://qarabic:qarabic@localhost:5432/qarabic_dev
      WEB_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:3000
      LOG_LEVEL: warn
      SEED_ADMIN_EMAIL: admin@example.test
      E2E_ADMIN_EMAIL: admin@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Throwaway secrets for this run
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "SEED_ADMIN_PASSWORD=$password"
            echo "E2E_ADMIN_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qarabic/shared build
      - run: pnpm --filter @qarabic/api exec prisma migrate deploy
      - run: pnpm --filter @qarabic/api db:seed
      - run: pnpm --filter @qarabic/web exec playwright install chromium
      - run: pnpm --filter @qarabic/web test:e2e:real
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-real-api
          path: apps/web/playwright-report

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high
