# N8 cut-over (docs/36 §8): api.qarabic.com → the new stack.
#
# Installed by deploy/switch.sh as
#   /etc/nginx/forge-conf/api.qarabic.com/server/qarabic-app.conf
# replacing the Laravel-era file (saved next to this one as qarabic-app.laravel.conf).
# It is included inside Forge's `server { … }` for api.qarabic.com, before Laravel's
# `location /` and `location ~ \.php$`, so TLS, the www/http redirects and Forge's own
# site file stay as they are. Rollback = put the Laravel file back (deploy/rollback.sh).
#
# `^~` prefix locations win over the PHP regex location, so /app/ and /api/ never reach PHP.
# Everything else (Laravel's other routes) still goes to Laravel, which is in maintenance mode.

# Web app: Next.js with basePath /app. proxy_pass without a URI keeps the /app prefix.
location = /app {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 /app/;
}
location ^~ /app/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    # Security headers (docs/39 P0-2). Any add_header here drops the server-level ones Forge sets,
    # so this list is complete on its own. nginx is the single source for these: the upstream's
    # copies are hidden so a browser never gets two different values.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-XSS-Protection;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The app's real CSP (nonces, sources) comes from Next.js and passes through. This second,
    # minimal policy is enforced together with it (browsers apply both), so it can only tighten.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
}

# API: NestJS (global prefix /api/v1, plus the old public form POST /api/class-request).
# The request body is passed through byte for byte (webhook signatures: WPForms, Stripe,
# PayPal, WhatsApp are checked over the raw body in Nest; nginx never rewrites a body).
location ^~ /api/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Ticket screenshots (support centre) are the largest uploads.
    client_max_body_size 20m;
    proxy_read_timeout 120s;
    # Security headers (docs/39 P0-2). Any add_header here drops the server-level ones Forge sets,
    # so this list is complete on its own. nginx is the single source for these: the upstream's
    # copies are hidden so a browser never gets two different values.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-XSS-Protection;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # JSON only: nothing may load or frame it (helmet's own CSP still passes through).
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}

# Health for the existing uptime check (Laravel's /up).
location = /up {
    proxy_pass http://127.0.0.1:4100/api/v1/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    access_log off;
    # Security headers (docs/39 P0-2). Any add_header here drops the server-level ones Forge sets,
    # so this list is complete on its own. nginx is the single source for these: the upstream's
    # copies are hidden so a browser never gets two different values.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-XSS-Protection;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # JSON only: nothing may load or frame it (helmet's own CSP still passes through).
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}
